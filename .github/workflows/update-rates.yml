name: Update Hipo rate dataset

# Daily snapshot of the treasury exchange rate / APY / TVL, and of the HPO buy-and-burn
# counters, into their Dune datasets.
# Requires repo secret DUNE_API_KEY (optionally TONCENTER_API_KEY, TON_ENDPOINT).

on:
  schedule:
    # Every 6 hours. Rounds are ~18h, so this samples each round ~3x → no round is ever missed.
    # The exporter keys rows by round_since, so intra-round re-runs just refresh that round's row.
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install deps
        working-directory: exporter
        run: npm ci --ignore-scripts

      - name: Snapshot rate and upload to Dune
        working-directory: exporter
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
          TON_ENDPOINT: ${{ secrets.TON_ENDPOINT }}
        run: node export-rates.mjs

      # Separate step so a burner-side failure cannot cost us the rate snapshot, which is the
      # one that must not miss a round.
      - name: Snapshot HPO buy-and-burn and upload to Dune
        working-directory: exporter
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
          TON_ENDPOINT: ${{ secrets.TON_ENDPOINT }}
        run: node export-burn.mjs

      - name: Commit updated CSVs
        run: |
          git config user.name "hipo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/treasury_rate.csv data/hpo_burn.csv
          git diff --staged --quiet || git commit -m "chore: update treasury rate and HPO burn datasets"
          git push
